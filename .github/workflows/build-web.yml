name: Build Web

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# One run per ref, so two pushes to main can't race on the "latest" release.
concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (WASM + HTML)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        run: ./build-wasm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: resample-pdf-web
          path: web/
          if-no-files-found: error

  release:
    name: Publish to releases
    needs: web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resample-pdf-web
          path: web

      - name: Publish web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Versioned release: create it if needed, otherwise replace the asset.
            TAG="$GITHUB_REF_NAME"
            ASSET="resample-pdf-web-${TAG}.zip"
            zip -qr "$ASSET" web
            gh release create "$TAG" --title "$TAG" --generate-notes "$ASSET" \
              || gh release upload "$TAG" --clobber "$ASSET"
          else
            # Rolling build of main: replace the "latest" prerelease each time.
            TAG="latest"
            ASSET="resample-pdf-web-latest.zip"
            zip -qr "$ASSET" web
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" \
              --title "Latest build (main)" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "Automated build of \`main\` @ ${GITHUB_SHA:0:7}. Unzip and serve over HTTP." \
              "$ASSET"
          fi

          echo "Published $ASSET to release $TAG" >> "$GITHUB_STEP_SUMMARY"
